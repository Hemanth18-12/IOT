# SmartRoom Mosquitto Topic Access Control List (ACL)
# Least-privilege topic authorization per MQTT client username.

# Backend service account: full access under smartroom/#
user smartroom_backend
topic readwrite smartroom/#

# Hardware device smartroom-01: can publish telemetry/state/events/ack/availability
# and subscribe only to its own commands and event acknowledgments.
user smartroom_device
topic write smartroom/smartroom-01/telemetry
topic write smartroom/smartroom-01/state
topic write smartroom/smartroom-01/events
topic write smartroom/smartroom-01/ack
topic write smartroom/smartroom-01/availability
topic read smartroom/smartroom-01/commands
topic read smartroom/smartroom-01/events/ack

# Simulator test device smartroom-sim-01: isolated from physical hardware topics
user smartroom_simulator
topic write smartroom/smartroom-sim-01/telemetry
topic write smartroom/smartroom-sim-01/state
topic write smartroom/smartroom-sim-01/events
topic write smartroom/smartroom-sim-01/ack
topic write smartroom/smartroom-sim-01/availability
topic read smartroom/smartroom-sim-01/commands
topic read smartroom/smartroom-sim-01/events/ack
