# SmartRoom Eclipse Mosquitto Configuration
# Requires password authentication and topic ACLs.

persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

# Standard MQTT listener accessible on local network
listener 1883 0.0.0.0
allow_anonymous false
password_file /mosquitto/config/passwords
acl_file /mosquitto/config/acl.conf

# ------------------------------------------------------------------
# Optional TLS Listener (recommended for production / remote links)
# Uncomment and generate certs before enabling port 8883:
# listener 8883 0.0.0.0
# cafile /mosquitto/certs/ca.crt
# certfile /mosquitto/certs/server.crt
# keyfile /mosquitto/certs/server.key
# require_certificate false
# tls_version tlsv1.2
# ------------------------------------------------------------------
